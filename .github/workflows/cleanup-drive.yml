name: Cleanup Drive (empty folders + duplicate files)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report or apply'
        default: 'apply'
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scan / clean (concurrent trash)
        env:
          CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          MODE: ${{ inputs.mode || 'apply' }}
        run: |
          python3 << 'PYEOF'
          import urllib.request as R, urllib.parse as P, json, os, sys, time as _t
          from concurrent.futures import ThreadPoolExecutor
          MODE=os.environ.get('MODE','apply')
          _td=P.urlencode({'client_id':os.environ['CLIENT_ID'],'client_secret':os.environ['CLIENT_SECRET'],
                           'refresh_token':os.environ['REFRESH_TOKEN'],'grant_type':'refresh_token'}).encode()
          token=json.load(R.urlopen(R.Request('https://oauth2.googleapis.com/token',data=_td,method='POST')))['access_token']
          def api(u,m='GET',b=None):
              last=None
              for a in range(4):
                  try:
                      h={'Authorization':f'Bearer {token}'}
                      if b is not None: h['Content-Type']='application/json'
                      return json.load(R.urlopen(R.Request(u,data=(json.dumps(b).encode() if b is not None else None),headers=h,method=m),timeout=120))
                  except Exception as e: last=e; _t.sleep(2)
              raise last
          def listall(q,fields):
              out,pg=[],None
              while True:
                  u='https://www.googleapis.com/drive/v3/files?q='+P.quote(q)+'&fields=nextPageToken,'+fields+'&pageSize=1000&corpora=user'
                  if pg:u+='&pageToken='+pg
                  r=api(u);out+=r.get('files',[]);pg=r.get('nextPageToken')
                  if not pg:break
              return out

          folders=listall("mimeType='application/vnd.google-apps.folder' and trashed=false and 'me' in owners",'files(id,name,parents)')
          files=listall("mimeType!='application/vnd.google-apps.folder' and trashed=false and 'me' in owners",'files(id,name,parents,md5Checksum)')
          print(f'folders:{len(folders)} files:{len(files)}',flush=True)
          child_files={}
          for f in files:
              for p in f.get('parents',[]): child_files[p]=child_files.get(p,0)+1
          child_folders={}
          for f in folders:
              for p in f.get('parents',[]): child_folders.setdefault(p,[]).append(f['id'])
          memo={}
          def has_file(fid):
              if fid in memo: return memo[fid]
              memo[fid]=False
              res=child_files.get(fid,0)>0
              if not res:
                  for c in child_folders.get(fid,[]):
                      if has_file(c): res=True; break
              memo[fid]=res; return res
          empty=[f for f in folders if not has_file(f['id'])]
          empty_ids=set(f['id'] for f in empty)
          top_empty=[f for f in empty if not any(p in empty_ids for p in f.get('parents',[]))]
          seen={}; dups=[]
          for f in files:
              k=(tuple(f.get('parents',[])),f['name'],f.get('md5Checksum'))
              if f.get('md5Checksum') and k in seen: dups.append(f)
              else: seen[k]=1
          targets=[f['id'] for f in top_empty]+[f['id'] for f in dups]
          print(f'EMPTY(top):{len(top_empty)} DUPS:{len(dups)} -> to trash:{len(targets)}',flush=True)
          if MODE!='apply':
              print('report only'); sys.exit(0)

          ok=[0]; err=[0]
          def trash(fid):
              try:
                  R.urlopen(R.Request(f'https://www.googleapis.com/drive/v3/files/{fid}',
                      data=json.dumps({'trashed':True}).encode(),method='PATCH',
                      headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}),timeout=60).read()
                  ok[0]+=1
              except Exception: err[0]+=1
          with ThreadPoolExecutor(max_workers=24) as ex:
              list(ex.map(trash,targets))
          print(f'DONE trashed:{ok[0]} skipped/err(403 non-app):{err[0]}',flush=True)
          PYEOF
