name: Map Mashmaut
on: { workflow_dispatch: {} }
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: fscarmen/warp-on-actions@v1.1
        with: { stack: dual }
      - run: pip install -q -U yt-dlp
      - name: Map videos + playlists
        run: |
          CH="https://www.youtube.com/channel/UCYTuhQta56TImmjtO9s5K3g"
          echo "===== VIDEOS COUNT ====="
          yt-dlp --flat-playlist --print id "$CH/videos" 2>/dev/null | wc -l
          echo "===== PLAYLISTS ====="
          yt-dlp --flat-playlist --print "%(title)s" "$CH/playlists" 2>err.txt || true
          echo "===== PLAYLIST ERR ====="
          tail -3 err.txt
